name: EconomyProviderAPIExample
version: 3.0.0
main: AxolotlBucketLabs\EconomyProviderAPIExample\Main
api: 5.0.0
description: Simple example plugin demonstrating EconomyProviderAPI usage
author: NhanAZ
authors: [AxolotlBucketLabs]
softdepend: [EconomyAPI, BedrockEconomy, SimpleEconomy]

commands:
  balance:
    description: Check your balance
    usage: /balance
    permission: economyproviderapiexample.balance

permissions:
  economyproviderapiexample.balance:
    default: true
    description: Allows checking your balance

name: EcoAPIExample
version: 2.0.0
main: AxolotlBucketLabs\EcoAPIExample\Main
api: 5.0.0
description: Simple example plugin demonstrating EcoAPI usage
author: NhanAZ
authors: [AxolotlBucketLabs]
softdepend: [EconomyAPI, BedrockEconomy, SimpleEconomy]

commands:
  balance:
    description: Check your balance
    usage: /balance
    permission: ecoapiexample.balance

permissions:
  ecoapiexample.balance:
    default: true
    description: Allows checking your balance
